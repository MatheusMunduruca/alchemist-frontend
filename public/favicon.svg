<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#1a6640"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="65%" r="55%">
      <stop offset="0%" stop-color="#2ecc71" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#2ecc71" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- fundo redondo escuro -->
  <circle cx="32" cy="32" r="32" fill="#1a0a2e"/>
  <circle cx="32" cy="40" r="26" fill="url(#glow)"/>

  <!-- corpo do frasco -->
  <path d="M27 12 h10 v12 l9 18 a14 14 0 0 1 -28 0 l9 -18 z"
        fill="rgba(255,255,255,0.10)" stroke="#c9a227" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- liquido -->
  <path d="M21.5 36 a13.5 13.5 0 0 0 21 0 z" fill="url(#liquid)"/>

  <!-- bolhas -->
  <circle cx="29" cy="42" r="2" fill="#a7f3d0" opacity="0.9"/>
  <circle cx="35" cy="46" r="1.5" fill="#a7f3d0" opacity="0.8"/>
  <circle cx="32" cy="39" r="1.2" fill="#a7f3d0" opacity="0.7"/>

  <!-- gargalo / rolha -->
  <rect x="26" y="8" width="12" height="6" rx="2" fill="#c9a227"/>

  <!-- brilho do vidro -->
  <path d="M30 16 l-6 16" stroke="rgba(255,255,255,0.35)" stroke-width="2" stroke-linecap="round"/>
</svg>
